syntax = 'proto3';

package report;

import 'shared/shared.proto';
import 'user/client.proto';
import 'user/employee.proto';

enum ReportStatus {
  IN_PROCESS = 0;
  ON_CONTROL = 1;
  TAKE_ON_TASK = 2;
  RETURNED_TO_INIT = 3;
  RETURNED_TO_WORK = 4;
  CLOSED = 5;
}

enum ReportFeedback {
  PHONE_NUMBER = 0;
  EMAIL = 1;
  NOT_REQUIRED = 2;
  OTHER = 3;
}

enum ReportPriority {
  LOW = 0;
  MEDIUM = 1;
  HIGH = 2;
  CRITICAL = 3;
}

message ThemePaginationInput {
  optional int32 page = 1;
  optional int32 limit = 2;
  optional string search = 3;
  optional string parentId = 4;
}

message GetThemesInput {
  client.ValidateInput validation = 1;
  ThemePaginationInput pagination = 2;
}

message GetThemeInput {
  client.ValidateInput validation = 1;
  string id = 2;
}

message GetThemesAdminInput {
  employee.ValidateInput validation = 1;
  ThemePaginationInput pagination = 2;
}

message GetThemeAdminInput {
  employee.ValidateInput validation = 1;
  string id = 2;
}

message CreateThemeInput {
  employee.ValidateInput validation = 1;
  string name = 2;
  optional string description = 3;
  optional string parentId = 4;
}

message UpdateThemeInput {
  employee.ValidateInput validation = 1;
  string id = 2;
  optional string name = 3;
  optional string description = 4;
  optional string parentId = 5;
}

message ThemeActionInput {
  employee.ValidateInput validation = 1;
  string id = 2;
}

message ThemeOutput {
  string id = 1;
  string name = 2;
  optional string description = 3;
  optional string parentId = 4;
  string createdAt = 5;
  string updatedAt = 6;
}

message ThemeDetailedOutput {
  string id = 1;
  string name = 2;
  optional string description = 3;
  optional string parentId = 4;
  string createdAt = 5;
  string updatedAt = 6;
  repeated ThemeOutput children = 7;
}

message ThemePaginationOutput {
  int32 page = 1;
  int32 limit = 2;
  int32 total = 3;
  int32 totalPages = 4;
  bool hasNext = 5;
  bool hasPrev = 6;
  optional string search = 7;
  optional string parentId = 8;
}

message PaginatedThemesOutput {
  ThemePaginationOutput pagination = 1;
  repeated ThemeOutput themes = 2;
}

message ReportPaginationInput {
  optional int32 page = 1;
  optional int32 limit = 2;
  optional string search = 3;
  optional string userId = 4;
  optional string assignedToId = 5;
  optional string themeId = 6;
  optional ReportStatus status = 7;
  optional ReportFeedback feedbackType = 8;
  optional ReportPriority priority = 9;
  optional string dateFrom = 10;
  optional string dateTo = 11;
}

message GetMyReportsInput {
  client.ValidateInput validation = 1;
  ReportPaginationInput pagination = 2;
}

message GetMyReportInput {
  client.ValidateInput validation = 1;
  string id = 2;
}

message GetReportsInput {
  employee.ValidateInput validation = 1;
  ReportPaginationInput pagination = 2;
}

message GetAdminReportInput {
  employee.ValidateInput validation = 1;
  string id = 2;
}

message CreateReportInput {
  client.ValidateInput validation = 1;
  string title = 2;
  string content = 3;
  optional string feedbackContact = 4;
  optional string themeId = 5;
  optional ReportFeedback feedbackType = 6;
}

message UpdateMyReportInput {
  client.ValidateInput validation = 1;
  string id = 2;
  optional string title = 3;
  optional string content = 4;
  optional string feedbackContact = 5;
  optional string themeId = 6;
  optional ReportFeedback feedbackType = 7;
}

message UpdateReportInput {
  employee.ValidateInput validation = 1;
  string id = 2;
  optional string title = 3;
  optional string content = 4;
  optional string feedbackContact = 5;
  optional string themeId = 6;
  optional ReportStatus status = 7;
  optional ReportFeedback feedbackType = 8;
  optional ReportPriority priority = 9;
  optional string assignedToId = 10;
}

message AssignReportInput {
  employee.ValidateInput validation = 1;
  string id = 2;
  optional string assignedToId = 3;
}

message ChangeReportStatusInput {
  employee.ValidateInput validation = 1;
  string id = 2;
  ReportStatus status = 3;
}

message ReportActionInput {
  employee.ValidateInput validation = 1;
  string id = 2;
}

message MyReportActionInput {
  client.ValidateInput validation = 1;
  string id = 2;
}

message ReportListOutput {
  string id = 1;
  optional string userId = 2;
  optional string assignedToId = 3;
  string title = 4;
  optional string themeId = 5;
  ReportStatus status = 6;
  ReportFeedback feedbackType = 7;
  ReportPriority priority = 8;
  string createdAt = 9;
  string updatedAt = 10;
}

message ReportOutput {
  string id = 1;
  optional string userId = 2;
  optional string assignedToId = 3;
  string title = 4;
  string content = 5;
  optional string feedbackContact = 6;
  optional string themeId = 7;
  ReportStatus status = 8;
  ReportFeedback feedbackType = 9;
  ReportPriority priority = 10;
  optional string resolvedAt = 11;
  string createdAt = 12;
  string updatedAt = 13;
}

message ReportPaginationOutput {
  int32 page = 1;
  int32 limit = 2;
  int32 total = 3;
  int32 totalPages = 4;
  bool hasNext = 5;
  bool hasPrev = 6;
  optional string search = 7;
  optional string userId = 8;
  optional string assignedToId = 9;
  optional string themeId = 10;
  optional ReportStatus status = 11;
  optional ReportFeedback feedbackType = 12;
  optional ReportPriority priority = 13;
  optional string dateFrom = 14;
  optional string dateTo = 15;
}

message PaginatedReportsOutput {
  ReportPaginationOutput pagination = 1;
  repeated ReportListOutput reports = 2;
}

service ReportService {
  rpc CreateReport(CreateReportInput) returns (ReportOutput);
  rpc GetMyReports(GetMyReportsInput) returns (PaginatedReportsOutput);
  rpc GetMyReport(GetMyReportInput) returns (ReportOutput);
  rpc UpdateMyReport(UpdateMyReportInput) returns (ReportOutput);
  rpc DeleteMyReport(MyReportActionInput) returns (shared.Empty);
}

service ReportAdminService {
  rpc GetReports(GetReportsInput) returns (PaginatedReportsOutput);
  rpc GetReport(GetAdminReportInput) returns (ReportOutput);
  rpc UpdateReport(UpdateReportInput) returns (ReportOutput);
  rpc AssignReport(AssignReportInput) returns (ReportOutput);
  rpc ChangeReportStatus(ChangeReportStatusInput) returns (ReportOutput);
  rpc ResolveReport(ReportActionInput) returns (ReportOutput);
  rpc DeleteReport(ReportActionInput) returns (shared.Empty);
}

service ThemeService {
  rpc GetThemes(GetThemesInput) returns (PaginatedThemesOutput);
  rpc GetTheme(GetThemeInput) returns (ThemeDetailedOutput);
}

service ThemeAdminService {
  rpc GetThemes(GetThemesAdminInput) returns (PaginatedThemesOutput);
  rpc GetTheme(GetThemeAdminInput) returns (ThemeDetailedOutput);
  rpc CreateTheme(CreateThemeInput) returns (ThemeOutput);
  rpc UpdateTheme(UpdateThemeInput) returns (ThemeOutput);
  rpc DeleteTheme(ThemeActionInput) returns (shared.Empty);
}
