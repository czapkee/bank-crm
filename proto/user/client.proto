syntax = 'proto3';

package client;

message RegisterInput {
  string email = 1;
  string password = 2;
  string confirmationPassword = 3;
}

message LoginInput {
  string email = 1;
  string password = 2;
}

message RefreshInput {
  string refreshToken = 1;
}

message ValidateInput {
  string accessToken = 1;
}

message ChangePasswordInput {
  string oldPassword = 1;
  string newPassword = 2;
  string newPasswordConfirmation = 3;
}

message AuthOutput {
  string accessToken = 1;
  string refreshToken = 2;
}

message UserPayload {
  string id = 1;
}

message UserEntity {
  string id = 1;
  string email = 2;
  string createdAt = 5;
  string updatedAt = 6;
}
