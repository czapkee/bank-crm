syntax = 'proto3';

package client;

message RegisterInput {
  string email = 1;
  string password = 2;
  string confirmationPassword = 3;
}

message LoginInput {
  string email = 1;
  string password = 2;
}

message RefreshInput {
  string refreshToken = 1;
}

message ValidateInput {
  string accessToken = 1;
}

message ChangePasswordInput {
  ValidateInput validation = 1;
  string oldPassword = 2;
  string newPassword = 3;
  string newPasswordConfirmation = 4;
}

message UpdateProfileInput {
  ValidateInput validation = 1;
  optional string name = 2;
  optional string surname = 3;
  optional string fatherName = 4;
  optional string phoneNumber = 5;
  optional bool isResident = 6;
  optional string identifCode = 7;
  optional string numPass = 8;
  optional string codeWord = 9;
  optional string address = 10;
}

message DeleteAccountInput {
  ValidateInput validation = 1;
  string password = 2;
}

message AuthOutput {
  string accessToken = 1;
  string refreshToken = 2;
}

message UserPayload {
  string id = 1;
}

message UserEntity {
  string id = 1;
  string email = 2;
  string createdAt = 5;
  string updatedAt = 6;
  string name = 3;
  string surname = 4;
  optional string fatherName = 7;
  string phoneNumber = 8;
  bool isResident = 9;
  string identifCode = 10;
  string numPass = 11;
  string codeWord = 12;
  string address = 13;
  bool isActive = 14;
}
