services:
  card-db:
    image: postgres:18.6-alpine
    container_name: card-db
    environment:
      POSTGRES_DB: ${CARD_DB_NAME}
      POSTGRES_USER: ${CARD_DB_USER}
      POSTGRES_PASSWORD: ${CARD_DB_PASSWORD}
    ports:
      - "${CARD_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CARD_DB_USER} -d ${CARD_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - card_db_data:/var/lib/postrgesql

  log-db:
    image: postgres:18.6-alpine
    container_name: log-db
    environment:
      POSTGRES_DB: ${LOG_DB_NAME}
      POSTGRES_USER: ${LOG_DB_USER}
      POSTGRES_PASSWORD: ${LOG_DB_PASSWORD}
    ports:
      - "${LOG_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LOG_DB_USER} -d ${LOG_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - log_db_data:/var/lib/postrgesql

  report-db:
    image: postgres:18.6-alpine
    container_name: report-db
    environment:
      POSTGRES_DB: ${REPORT_DB_NAME}
      POSTGRES_USER: ${REPORT_DB_USER}
      POSTGRES_PASSWORD: ${REPORT_DB_PASSWORD}
    ports:
      - "${REPORT_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${REPORT_DB_USER} -d ${REPORT_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - report_db_data:/var/lib/postrgesql

  user-db:
    image: postgres:18.6-alpine
    container_name: user-db
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_DB_PORT}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${USER_DB_USER} -d ${USER_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - user_db_data:/var/lib/postrgesql

volumes:
  user_db_data:
  report_db_data:
  log_db_data:
  card_db_data:
